<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>针灸治疗原则</title></head><body>
<h1>针灸治疗原则</h1>
<p>针灸治疗强调辨证论治。选经、选穴和配穴应围绕病位、病性、虚实和个体状态展开，而不是固定套用某一组穴位。</p>
<h2>选经思路</h2>
<p>可根据经脉循行、脏腑表里关系和病变部位选经。局部症状明显时考虑近部选穴，远端症状或脏腑相关时考虑循经远取。</p>
<h2>配穴方法</h2>
<p>常用配穴包括远近配穴、前后配穴、上下配穴、左右配穴和表里配穴。配穴数量应适度，重点突出主穴与配穴的协同关系。</p>
<h2>疗效评估</h2>
<p>治疗前后应记录主要症状、功能变化和不良反应，避免仅凭主观印象判断。学习阶段要把安全、规范和可复核放在首位。</p>
</body></html>
