<h1>腧穴总论</h1>
<p>腧穴是脏腑经络之气输注于体表的部位，也是针灸施术和推拿取穴的重要位置。学习腧穴不仅要记位置，还要理解定位方法、主治规律和配伍思路。</p>
<h2>分类</h2>
<p>腧穴一般分为十四经穴、经外奇穴和阿是穴。十四经穴归属于十二经脉和任督二脉；经外奇穴有固定名称和位置；阿是穴以压痛或反应点为依据。</p>
<h2>定位方法</h2>
<p>常用定位方法包括体表标志法、骨度分寸法、手指同身寸法和简便取穴法。定位时应结合体位、胖瘦和局部解剖，避免只凭单一比例。</p>
<h2>主治规律</h2>
<p>腧穴主治具有邻近作用、远治作用和特殊作用。远端取穴常与经脉循行相关，局部取穴则多针对病变部位。临床学习要重视安全边界与禁忌。</p>
