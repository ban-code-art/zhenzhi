<h1>十二经脉</h1>
<p>十二经脉包括手三阴、手三阳、足三阴、足三阳，是经络系统的主体。它们首尾相接，形成气血运行的循环网络，并与脏腑形成表里配合。</p>
<h2>走向规律</h2>
<p>手三阴经从胸走手，手三阳经从手走头，足三阳经从头走足，足三阴经从足走腹胸。理解这一规律，有助于判断经脉循行方向和病位传变。</p>
<h2>表里关系</h2>
<p>肺与大肠、心与小肠、心包与三焦、脾与胃、肝与胆、肾与膀胱互为表里。表里经在生理上相互联系，在病理上也可相互影响。</p>
<h2>学习建议</h2>
<ol><li>按手足、阴阳、脏腑三组线索整理经脉表。</li><li>把循行路线与常用腧穴结合记忆。</li><li>遇到跨经症状时，先辨主次，再考虑配经配穴。</li></ol>
</body></html>
