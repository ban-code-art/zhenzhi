<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>刺法基础</title></head><body>
<h1>刺法基础</h1>
<p>刺法是以针具刺激腧穴、调节经络气血的操作技术。学习刺法首先要建立无菌观念、解剖安全意识和规范操作流程，不能只记忆手法名称。</p>
<h2>基本环节</h2>
<p>包括选择针具、确定体位、消毒、进针、行针、留针与出针。每个环节都影响安全与效果，尤其是进针方向和深度。</p>
<h2>常见手法</h2>
<p>基本手法有提插法和捻转法，辅助手法包括循法、弹法、刮法等。手法练习应先在规范教具上进行，避免在人体上盲目试针。</p>
<h2>安全边界</h2>
<p>胸部、颈部、腹部和关节附近存在重要脏器、血管和神经，必须掌握解剖层次与禁忌。出现晕针、滞针、血肿等情况应按规范处理并及时就医。</p>
</body></html>
