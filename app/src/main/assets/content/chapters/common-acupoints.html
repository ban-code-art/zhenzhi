<h1>常用腧穴</h1>
<p>常用腧穴的学习应从定位、归经、主治和操作注意四个方面建立卡片。以下仅列举学习示例，实际应用需在专业指导下进行。</p>
<h2>合谷</h2>
<p>合谷属手阳明大肠经，位于手背第一、二掌骨之间。学习中常将其作为远端取穴和面口部问题的示例，但孕妇等特殊人群应谨慎。</p>
<h2>足三里</h2>
<p>足三里属足阳明胃经，位于小腿前外侧。它是常用的保健与脾胃相关学习穴位，定位时需结合胫骨前嵴和犊鼻下三寸等标志。</p>
<h2>内关</h2>
<p>内关属手厥阴心包经，位于前臂掌侧。学习时常用于理解心胸部症状与经脉联系，但针刺深度和方向必须遵循规范。</p>
<h2>三阴交</h2>
<p>三阴交属足太阴脾经，位于小腿内侧。它是足三阴经交会穴，学习时要特别注意孕期等禁忌与个体差异。</p>
</body></html>
