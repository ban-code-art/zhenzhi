<h1>灸法基础</h1>
<p>灸法利用艾绒或其他材料燃烧产生的温热刺激防治疾病。学习灸法要同时掌握适应证、禁忌证、火力控制和防止烫伤的措施。</p>
<h2>常见分类</h2>
<p>按施灸形式可分为艾炷灸、艾条灸、温针灸和器械灸等；按是否起泡可分为非化脓灸和化脓灸。现代学习更强调安全、可控和个体化。</p>
<h2>注意事项</h2>
<ul><li>保持通风，防止烟雾刺激和火灾。</li><li>感觉减退、皮肤破损或特殊人群应谨慎。</li><li>施灸过程中要持续观察皮肤反应，避免烫伤。</li></ul>
